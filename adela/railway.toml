# =============================================================================
# Railway service config — Adela (CropsIntel V3 runtime nervous system)
# =============================================================================
# Adela is the standalone scraper service that ingests ABC position reports,
# Strata positions, and ag-news RSS into V3 Supabase. Built from
# adela/Dockerfile and exposes /health on $PORT for Railway healthchecks.
#
# Required env vars (set in Railway, never in code):
#   V3_SUPABASE_URL          - Supabase project URL
#   V3_SUPABASE_SECRET_KEY   - sb_secret_... key (apikey header)
#   GEMINI_API_KEY           - Google AI Studio key (ABC PDF extraction)
#
# Optional env vars:
#   STRATA_BASE_URL, STRATA_USERNAME, STRATA_PASSWORD - enable strata scraper
#   NEWS_FEEDS                - comma-separated RSS/Atom feed URLs
#   CRON_ABC, CRON_STRATA, CRON_NEWS - override default cron schedules
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM,
#   TWILIO_WHATSAPP_TO        - WhatsApp startup + alert notifications
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Use the persistent in-process node-cron scheduler — NOT Railway cron.
# Railway cron starts a fresh container each tick, which would miss our
# 15-minute ABC cadence on cold starts.
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
