<!DOCTYPE html>
<html>
<head>
  <title>Strata Almond Price Sheet</title>
</head>
<body>
  <h1>Almond Prices - Current Week</h1>
  <table class="prices" data-type="prices">
    <thead>
      <tr>
        <th>Variety</th>
        <th>Form</th>
        <th>Grade</th>
        <th>Price (USD/lb)</th>
      </tr>
    </thead>
    <tbody>
      <tr class="price-row" data-type="price">
        <td class="variety" data-field="variety">Nonpareil</td>
        <td class="form product-type" data-field="form">Whole</td>
        <td class="grade size" data-field="grade">23/25</td>
        <td class="price usd-per-lb" data-field="price">$3.45</td>
      </tr>
      <tr class="price-row" data-type="price">
        <td class="variety" data-field="variety">Nonpareil</td>
        <td class="form product-type" data-field="form">Sliced</td>
        <td class="grade size" data-field="grade">27/30</td>
        <td class="price usd-per-lb" data-field="price">$3.20</td>
      </tr>
      <tr class="price-row" data-type="price">
        <td class="variety" data-field="variety">Carmel</td>
        <td class="form product-type" data-field="form">Whole</td>
        <td class="grade size" data-field="grade">25/27</td>
        <td class="price usd-per-lb" data-field="price">$2.95</td>
      </tr>
      <tr class="price-row" data-type="price">
        <td class="variety" data-field="variety">Butte</td>
        <td class="form product-type" data-field="form">Pieces</td>
        <td class="grade size" data-field="grade">Small</td>
        <td class="price usd-per-lb" data-field="price">$2.10</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
