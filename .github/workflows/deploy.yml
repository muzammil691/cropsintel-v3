name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs on the same branch
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ATLAS_URL: ${{ secrets.VITE_ATLAS_URL }}
          VITE_ATLAS_API_TOKEN: ${{ secrets.VITE_ATLAS_API_TOKEN }}

      - name: Add SPA fallback for GitHub Pages
        run: |
          # GitHub Pages serves static files. Copy index.html to 404.html
<<<<<<< Updated upstream
          # so any unknown path falls through to the React app shell, which
          # then routes client-side. Without this, /atlas returns hard 404.
=======
          # so client-side React Router can handle /atlas, /atlas/*, etc.
>>>>>>> Stashed changes
          cp dist/index.html dist/404.html
          echo "SPA fallback: dist/404.html created"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
