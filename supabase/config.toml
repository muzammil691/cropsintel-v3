# Supabase CLI configuration for V3
# Project ref: hzrnohsxigrqlmzegwlb
# After `npx supabase link --project-ref hzrnohsxigrqlmzegwlb`, the CLI uses this file.

project_id = "cropsintel-v3"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "https://cropsintel.com",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = true

# Edge Functions config
# Public-facing functions handle anonymous (pre-signup) traffic, so they CANNOT
# require a JWT — Supabase would return 401 before the function runs. Each
# function still validates inputs, rate-limits via agent_rate_limits, and
# writes audit-log entries; verify_jwt only controls the gateway gate.
# Set per Phase 1.3c (V1.0-alpha unblock).

[functions.whatsapp-send-otp]
verify_jwt = false

[functions.whatsapp-verify-otp]
verify_jwt = false

[functions.auth-bridge]
verify_jwt = false

[functions.guest-gate]
verify_jwt = false

[functions.zyra-chat]
verify_jwt = false
